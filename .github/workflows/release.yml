name: Draft Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and prepare draft release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $appProject = "src\Zlet.FolderConverter.App\Zlet.FolderConverter.App.csproj"
          function Get-ProjectProperty([string]$Name) {
            $value = (& dotnet msbuild $appProject -nologo "-getProperty:$Name" |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Last 1).Trim()
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "$Name is empty."
            }
            return $value
          }

          $version = Get-ProjectProperty "ZletProductVersion"
          $productName = Get-ProjectProperty "ZletProductName"
          $executableName = Get-ProjectProperty "ZletExecutableName"
          $portablePackageName = Get-ProjectProperty "ZletPortablePackageName"

          $tag = "v$version"
          $notes = "docs\RELEASE_NOTES_v$version.md"
          $installer = "$executableName-v$version-Setup-win-x64.exe"
          $portable = "$portablePackageName.zip"

          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes file is missing: $notes"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "product_name=$productName" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT

      - name: Guard against duplicate release or orphan tag
        id: gate
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"

          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          $releaseExit = $LASTEXITCODE
          if ($releaseExit -eq 0) {
            Write-Output "Release $tag already exists; nothing to build."
            "exists=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" *> $null
          $tagExit = $LASTEXITCODE
          if ($tagExit -eq 0) {
            throw "Tag $tag exists without a release. Refusing to reuse an unverified tag."
          }

          "exists=false" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Restore
        if: steps.gate.outputs.exists != 'true'
        run: dotnet restore FolderConverter.sln

      - name: Build
        if: steps.gate.outputs.exists != 'true'
        run: dotnet build FolderConverter.sln -c Release --no-restore

      - name: Test
        if: steps.gate.outputs.exists != 'true'
        run: dotnet test FolderConverter.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Test Anydoc Worker (Rust)
        if: steps.gate.outputs.exists != 'true'
        run: cargo test --manifest-path src/Zlet.FolderConverter.AnydocWorker/Cargo.toml --locked

      - name: Build Anydoc Worker (Rust)
        if: steps.gate.outputs.exists != 'true'
        run: cargo build --manifest-path src/Zlet.FolderConverter.AnydocWorker/Cargo.toml --release --locked

      - name: Restore win-x64 runtime packs for packaging
        if: steps.gate.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet restore src\Zlet.FolderConverter.App\Zlet.FolderConverter.App.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) {
            throw "App win-x64 runtime restore failed."
          }

          dotnet restore src\Zlet.FolderConverter.OfficeWorker\Zlet.FolderConverter.OfficeWorker.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) {
            throw "OfficeWorker win-x64 runtime restore failed."
          }

      - name: Install Inno Setup 6
        if: steps.gate.outputs.exists != 'true'
        shell: pwsh
        run: |
          $knownPaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )

          $hasCompiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
            ($knownPaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })

          if (-not $hasCompiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup installation failed."
            }
          }

      - name: Build installer and portable package
        if: steps.gate.outputs.exists != 'true'
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Release packaging failed."
          }

      - name: Validate packages and calculate SHA-256
        if: steps.gate.outputs.exists != 'true'
        id: package
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "artifacts\installer\win-x64\${{ steps.meta.outputs.installer }}"
          $portable = Join-Path $PWD "artifacts\portable\win-x64\${{ steps.meta.outputs.portable }}"
          $checksums = Join-Path $PWD "artifacts\SHA256SUMS.txt"

          foreach ($path in @($installer, $portable)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected release file is missing: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Release file is empty: $path"
            }
          }

          # Packaging validation gate: verify zlet-anydoc-worker.exe in portable ZIP
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($portable)
          $hasWorker = $zip.Entries | Where-Object { $_.Name -eq "zlet-anydoc-worker.exe" }
          $zip.Dispose()
          if (-not $hasWorker) {
            throw "Packaging validation gate failed: zlet-anydoc-worker.exe is missing from portable ZIP!"
          }

          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()

          @(
            "$installerHash  $([System.IO.Path]::GetFileName($installer))",
            "$portableHash  $([System.IO.Path]::GetFileName($portable))"
          ) | Set-Content -LiteralPath $checksums -Encoding ascii

          "installer_path=$installer" >> $env:GITHUB_OUTPUT
          "portable_path=$portable" >> $env:GITHUB_OUTPUT
          "checksums_path=$checksums" >> $env:GITHUB_OUTPUT

          Write-Output "Installer SHA-256: $installerHash"
          Write-Output "Portable SHA-256: $portableHash"

      - name: Create Draft Release and upload assets directly
        if: steps.gate.outputs.exists != 'true'
        id: publish
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $title = "${{ steps.meta.outputs.product_name }} $tag"

          gh release create $tag `
            "${{ steps.package.outputs.installer_path }}" `
            "${{ steps.package.outputs.portable_path }}" `
            "${{ steps.package.outputs.checksums_path }}" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $title `
            --notes-file "${{ steps.meta.outputs.notes }}" `
            --draft

          if ($LASTEXITCODE -ne 0) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag *> $null
            throw "Draft Release creation or asset upload failed."
          }

          "created=true" >> $env:GITHUB_OUTPUT

      - name: Remove local packaging files
        if: always() && steps.gate.outputs.exists != 'true'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "artifacts") {
            Remove-Item -LiteralPath "artifacts" -Recurse -Force
          }

      - name: Release summary
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.gate.outputs.exists }}" -eq "true") {
            @(
              "## Draft Release",
              "Release ${{ steps.meta.outputs.tag }} already exists. No duplicate build was created."
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          if ("${{ steps.publish.outputs.created }}" -eq "true") {
            @(
              "## Draft Release ${{ steps.meta.outputs.tag }}",
              "- Target commit: $env:GITHUB_SHA",
              "- Installer and portable ZIP were uploaded directly to GitHub Release.",
              "- No Actions artifacts were created.",
              "- Local packaging files were removed from the temporary runner.",
              "- Release remains Draft and is not published automatically.",
              "- Draft is not marked as a GitHub Pre-release by default.",
              "- Real Microsoft Office integration and manual clean-machine verification were not run on the hosted runner."
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          @(
            "## Draft Release failed",
            "Draft Release ${{ steps.meta.outputs.tag }} was not prepared successfully.",
            "See the failed workflow step above. No successful release preparation is being claimed."
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          exit 0
