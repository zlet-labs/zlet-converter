name: ZC-051 one-time renderer fix

on:
  push:
    branches:
      - zc-051-anydoc-routing

permissions:
  contents: write

concurrency:
  group: zc051-renderer-fix
  cancel-in-progress: false

jobs:
  apply-fix:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: zc-051-anydoc-routing
          fetch-depth: 0

      - name: Apply exact renderer fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/Zlet.FolderConverter.AnydocWorker/src/renderer.rs")
          text = path.read_text(encoding="utf-8")

          old = '''            Block::List(list) => {
                          let (open_tag, close_tag) = match list.marker {
                              MarkerKind::Bullet => ("<ul>".to_string(), "</ul>"),
                              _ => {
                                  if list.start != 1 {
                                      (format!("<ol start=\\\"{}\\\">", list.start), "</ol>")
                                  } else {
                                      ("<ol>".to_string(), "</ol>")
                                  }
                              }
                          };
                          out.push_str(&open_tag);
                          for item in &list.items {
                              out.push_str("<li>");
                              render_cell_blocks_html(&item.blocks, ctx, out);
                              out.push_str("</li>");
                          }
                          out.push_str(close_tag);
                      }'''

          new = '''            Block::List(list) => {
                          let start_attr = if list.start != 1 {
                              format!(" start=\\\"{}\\\"", list.start)
                          } else {
                              String::new()
                          };
                          let (open_tag, close_tag) = match list.marker {
                              MarkerKind::Bullet => ("<ul>".to_string(), "</ul>"),
                              MarkerKind::Decimal => (format!("<ol{}>", start_attr), "</ol>"),
                              MarkerKind::LowerAlpha => {
                                  (format!("<ol type=\\\"a\\\"{}>", start_attr), "</ol>")
                              }
                              MarkerKind::UpperAlpha => {
                                  (format!("<ol type=\\\"A\\\"{}>", start_attr), "</ol>")
                              }
                              MarkerKind::LowerRoman => {
                                  (format!("<ol type=\\\"i\\\"{}>", start_attr), "</ol>")
                              }
                              MarkerKind::UpperRoman => {
                                  (format!("<ol type=\\\"I\\\"{}>", start_attr), "</ol>")
                              }
                          };
                          out.push_str(&open_tag);
                          for item in &list.items {
                              if let Some(label) = item
                                  .marker_label
                                  .as_deref()
                                  .filter(|label| !label.trim().is_empty())
                              {
                                  out.push_str("<li style=\\\"list-style-type:none\\\"><span class=\\\"zlet-list-marker\\\">");
                                  out.push_str(&html_escape(label.trim()));
                                  out.push_str("</span> ");
                              } else {
                                  out.push_str("<li>");
                              }
                              render_cell_blocks_html(&item.blocks, ctx, out);
                              out.push_str("</li>");
                          }
                          out.push_str(close_tag);
                      }'''

          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one legacy HTML list renderer block, found {text.count(old)}")
          text = text.replace(old, new, 1)

          anchor = '''    #[test]
              fn test_html_table_cell_ordered_list_start() {
                  let list = List {
                      marker: MarkerKind::Decimal,
                      start: 5,
                      items: vec![
                          ListItem {
                              blocks: vec![Block::Paragraph(vec![Inline::plain("Fifth item")])],
                              marker_label: None,
                          },
                      ],
                  };
                  let ctx = RenderContext { asset_map: HashMap::new() };
                  let mut out = String::new();
                  render_cell_blocks_html(&[Block::List(list)], &ctx, &mut out);
                  assert!(out.contains("<ol start=\\\"5\\\"><li>Fifth item</li></ol>"));
              }
          }'''

          replacement = '''    #[test]
              fn test_html_table_cell_ordered_list_start() {
                  let list = List {
                      marker: MarkerKind::Decimal,
                      start: 5,
                      items: vec![
                          ListItem {
                              blocks: vec![Block::Paragraph(vec![Inline::plain("Fifth item")])],
                              marker_label: None,
                          },
                      ],
                  };
                  let ctx = RenderContext { asset_map: HashMap::new() };
                  let mut out = String::new();
                  render_cell_blocks_html(&[Block::List(list)], &ctx, &mut out);
                  assert!(out.contains("<ol start=\\\"5\\\"><li>Fifth item</li></ol>"));
              }

              #[test]
              fn test_html_table_cell_preserves_ordered_marker_kinds() {
                  let cases = [
                      (MarkerKind::LowerAlpha, "a"),
                      (MarkerKind::UpperAlpha, "A"),
                      (MarkerKind::LowerRoman, "i"),
                      (MarkerKind::UpperRoman, "I"),
                  ];
                  let ctx = RenderContext { asset_map: HashMap::new() };

                  for (marker, html_type) in cases {
                      let list = List {
                          marker,
                          start: 3,
                          items: vec![ListItem {
                              blocks: vec![Block::Paragraph(vec![Inline::plain("Item")])],
                              marker_label: None,
                          }],
                      };
                      let mut out = String::new();
                      render_cell_blocks_html(&[Block::List(list)], &ctx, &mut out);
                      assert_eq!(
                          out,
                          format!("<ol type=\\\"{}\\\" start=\\\"3\\\"><li>Item</li></ol>", html_type)
                      );
                  }
              }

              #[test]
              fn test_html_table_cell_preserves_custom_marker_label() {
                  let list = List {
                      marker: MarkerKind::Decimal,
                      start: 3,
                      items: vec![ListItem {
                          blocks: vec![Block::Paragraph(vec![Inline::plain("Custom item")])],
                          marker_label: Some("3-a) <unsafe>".into()),
                      }],
                  };
                  let ctx = RenderContext { asset_map: HashMap::new() };
                  let mut out = String::new();
                  render_cell_blocks_html(&[Block::List(list)], &ctx, &mut out);
                  assert!(out.contains(
                      "<li style=\\\"list-style-type:none\\\"><span class=\\\"zlet-list-marker\\\">3-a) &lt;unsafe&gt;</span> Custom item</li>"
                  ));
                  assert!(!out.contains("<unsafe>"));
              }

              #[test]
              fn test_complex_table_path_preserves_roman_list_marker() {
                  let table = Table {
                      grid: vec![vec![CellSlot::Origin(Cell::new(vec![Block::List(List {
                          marker: MarkerKind::LowerRoman,
                          start: 4,
                          items: vec![ListItem {
                              blocks: vec![Block::Paragraph(vec![Inline::plain("Fourth")])],
                              marker_label: None,
                          }],
                      })]))]],
                      header_rows: 0,
                      kind: TableKind::Data,
                  };
                  assert!(is_table_complex(&table));

                  let ctx = RenderContext { asset_map: HashMap::new() };
                  let mut out = String::new();
                  render_adaptive_table(&table, &ctx, &mut out);
                  assert!(out.contains("<table>"));
                  assert!(out.contains("<ol type=\\\"i\\\" start=\\\"4\\\"><li>Fourth</li></ol>"));
              }
          }'''

          if text.count(anchor) != 1:
              raise SystemExit(f"Expected exactly one final renderer test anchor, found {text.count(anchor)}")
          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Format and test native worker
        shell: pwsh
        run: |
          cargo fmt --manifest-path src/Zlet.FolderConverter.AnydocWorker/Cargo.toml
          cargo test --manifest-path src/Zlet.FolderConverter.AnydocWorker/Cargo.toml --locked
          cargo build --manifest-path src/Zlet.FolderConverter.AnydocWorker/Cargo.toml --release --locked

      - name: Commit renderer fix and remove one-time workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath ".github/workflows/zc051-renderer-fix.yml" -Force
          git config user.name "iWebCod"
          git config user.email "iwebcod@gmail.com"
          git add src/Zlet.FolderConverter.AnydocWorker/src/renderer.rs .github/workflows/zc051-renderer-fix.yml
          $changed = git diff --cached --name-only
          if ($changed -notcontains "src/Zlet.FolderConverter.AnydocWorker/src/renderer.rs") {
            throw "Renderer fix was not staged."
          }
          git commit -m "ZC-051 Preserve list marker semantics in HTML tables"
          git push origin HEAD:zc-051-anydoc-routing
