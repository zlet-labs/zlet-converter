name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Restore, build and test
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build and test native worker
        run: |
          cargo test --manifest-path src/Zlet.FolderConverter.AnydocWorker/Cargo.toml --locked
          cargo build --manifest-path src/Zlet.FolderConverter.AnydocWorker/Cargo.toml --release --locked

      - name: Restore
        run: dotnet restore FolderConverter.sln

      - name: Build
        run: dotnet build FolderConverter.sln -c Release --no-restore

      - name: Test
        run: dotnet test FolderConverter.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Verify portable package and Rust third-party notices
        if: github.event_name != 'pull_request'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/publish-portable.ps1
