name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Restore, build and test
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build and test native worker
        run: |
          cargo test --manifest-path src/Zlet.FolderConverter.AnydocWorker/Cargo.toml --locked
          cargo build --manifest-path src/Zlet.FolderConverter.AnydocWorker/Cargo.toml --release --locked

      - name: Restore
        run: dotnet restore FolderConverter.sln

      - name: Build
        run: dotnet build FolderConverter.sln -c Release --no-restore

      - name: Test
        run: dotnet test FolderConverter.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Test packaged acceptance report mapping
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/test-packaged-acceptance-mapping.ps1

      - name: Verify portable package and Rust third-party notices
        if: github.event_name != 'pull_request'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/publish-portable.ps1


  linux-headless:
    name: Linux headless build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build Linux anydoc worker
        run: cargo build --manifest-path src/Zlet.FolderConverter.AnydocWorker/Cargo.toml --release --locked

      - name: Publish Linux headless runtime
        run: dotnet publish src/Zlet.FolderConverter.Cli/Zlet.FolderConverter.Cli.csproj -c Release -r linux-x64 --self-contained true -o artifacts/linux-x64

      - name: Smoke test Linux headless runtime
        shell: bash
        run: |
          chmod +x artifacts/linux-x64/zlet-converter artifacts/linux-x64/zlet-anydoc-worker
          mkdir -p /tmp/zlet-source /tmp/zlet-output /tmp/zlet-evidence
          cp evaluation/fixtures/F08_structured.docx /tmp/zlet-source/document.docx
          printf '# Zlet Linux acceptance\n' > /tmp/zlet-source/notes.txt
          artifacts/linux-x64/zlet-converter batch \
            --source /tmp/zlet-source \
            --destination /tmp/zlet-output \
            --target markdown \
            --recursive true \
            --report-json /tmp/zlet-evidence/report.json
          test -s /tmp/zlet-output/document.md
          test -s /tmp/zlet-output/notes.md
          test -s /tmp/zlet-evidence/report.json
          grep -q '"finalState": "COMPLETED"' /tmp/zlet-evidence/report.json

      - name: Pack Linux headless artifact
        shell: bash
        run: |
          tar -C artifacts/linux-x64 -czf artifacts/zlet-converter-linux-x64.tar.gz .
          tar -tzvf artifacts/zlet-converter-linux-x64.tar.gz | awk '$NF == "./zlet-converter" && $1 ~ /^-rwx/ { found=1 } END { exit !found }'
          tar -tzvf artifacts/zlet-converter-linux-x64.tar.gz | awk '$NF == "./zlet-anydoc-worker" && $1 ~ /^-rwx/ { found=1 } END { exit !found }'

      - name: Upload Linux headless artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlet-converter-linux-x64-${{ github.sha }}
          path: artifacts/zlet-converter-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
